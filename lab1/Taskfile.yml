version: '3'

vars:
  L: '16'
  M: '16'
  N: '16'
  RUSTFLAGS_VEC: '-C opt-level=3 -C target-cpu=native'
  RUSTFLAGS_NOVEC: '-C opt-level=3 -C llvm-args=-vectorize-loops=false -C llvm-args=-vectorize-slp=false'

tasks:
  default:
    cmds:
      - task --list

  test:
    desc: Тесты (Release)
    cmds:
      - cargo test --release

  run-vec:
    desc: 'Запуск с автовекторизацией. Пример: task run-vec L=64 M=64 N=64'
    env:
      RUSTFLAGS: '{{.RUSTFLAGS_VEC}}'
    cmds:
      - cargo run --release -- --l {{.L}} --m {{.M}} --n {{.N}}

  run-novec:
    desc: 'Запуск без автовекторизации. Пример: task run-novec L=64 M=64 N=64'
    env:
      RUSTFLAGS: '{{.RUSTFLAGS_NOVEC}}'
    cmds:
      - cargo run --release -- --l {{.L}} --m {{.M}} --n {{.N}}

  test-x86:
    desc: Тесты x86_64 (Mac / Rosetta)
    platforms: [darwin]
    cmds:
      - rustup target add x86_64-apple-darwin
      - cargo test --release --target x86_64-apple-darwin

  run-vec-x86:
    desc: 'x86_64 + векторизация (Mac). Пример: task run-vec-x86 L=48 M=48 N=48'
    platforms: [darwin]
    env:
      RUSTFLAGS: '-C opt-level=3 -C target-cpu=x86-64'
    cmds:
      - rustup target add x86_64-apple-darwin
      - cargo run --release --target x86_64-apple-darwin -- --l {{.L}} --m {{.M}} --n {{.N}}

  run-novec-x86:
    desc: 'x86_64 без векторизации (Mac). Пример: task run-novec-x86 L=48 M=48 N=48'
    platforms: [darwin]
    env:
      RUSTFLAGS: '{{.RUSTFLAGS_NOVEC}} -C target-cpu=x86-64'
    cmds:
      - rustup target add x86_64-apple-darwin
      - cargo run --release --target x86_64-apple-darwin -- --l {{.L}} --m {{.M}} --n {{.N}}

  asm:
    desc: Дизасм ядра mul_add_block_auto (нужен cargo-show-asm)
    env:
      RUSTFLAGS: '{{.RUSTFLAGS_VEC}}'
    cmds:
      - cargo asm --release --bin lab1 "lab1::mul_auto::mul_add_block_auto"
