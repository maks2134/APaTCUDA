version: '3'

vars:
  L: '16'
  M: '16'
  N: '16'
  RUSTFLAGS_VEC: '-C opt-level=3 -C target-cpu=native'
  RUSTFLAGS_NOVEC: '-C opt-level=3 -C llvm-args=-vectorize-loops=false -C llvm-args=-vectorize-slp=false'

tasks:
  default:
    cmds:
      - task --list

  run-vec:
    desc: 'С автовекторизацией. Пример: task run-vec L=64 M=64 N=64'
    env:
      RUSTFLAGS: '{{.RUSTFLAGS_VEC}}'
    cmds:
      - cargo run --release -- --l {{.L}} --m {{.M}} --n {{.N}}

  run-novec:
    desc: 'Без автовекторизации. Пример: task run-novec L=64 M=64 N=64'
    env:
      RUSTFLAGS: '{{.RUSTFLAGS_NOVEC}}'
    cmds:
      - cargo run --release -- --l {{.L}} --m {{.M}} --n {{.N}}

  build-vec-exe:
    desc: Собрать и сохранить lab1_vec.exe
    env:
      RUSTFLAGS: '{{.RUSTFLAGS_VEC}}'
    cmds:
      - cargo build --release
      - cmd /C copy /Y target\release\lab1.exe target\release\lab1_vec.exe

  build-novec-exe:
    desc: Собрать и сохранить lab1_novec.exe
    env:
      RUSTFLAGS: '{{.RUSTFLAGS_NOVEC}}'
    cmds:
      - cargo build --release
      - cmd /C copy /Y target\release\lab1.exe target\release\lab1_novec.exe

  build-both-exe:
    desc: Сохранить оба exe (vec и novec) для uProf
    cmds:
      - task: build-vec-exe
      - task: build-novec-exe
      - cmd /C dir target\release\lab1_*.exe

  asm:
    desc: Дизасм mul_add_block_auto (нужен cargo-show-asm)
    env:
      RUSTFLAGS: '{{.RUSTFLAGS_VEC}}'
    cmds:
      - cargo asm --release --bin lab1 "lab1::mul_auto::mul_add_block_auto"

  asm-sse2:
    desc: Дизасм mul_add_block_sse2 (нужен cargo-show-asm)
    env:
      RUSTFLAGS: '{{.RUSTFLAGS_VEC}}'
    cmds:
      - cargo asm --release --bin lab1 "lab1::mul_sse2::mul_add_block_sse2"
