[package]
name = "lab4"
version = "0.1.0"
edition = "2024"
description = "Lab 4: percentiles 25/50/75 via bitonic sort (variant 28) — CPU + CUDA via cudarc"
publish = false

[[bin]]
name = "lab4"
path = "src/main.rs"

[dependencies]
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cuda-version-from-build-system",
    "fallback-dynamic-loading",
] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
debug = false
strip = "none"
